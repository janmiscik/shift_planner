{% extends "base.html" %}

{% block title %}
    Pridať smenu - Shift Planner
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Pridať smenu</h1>

        <p>
            Naplánovanie novej pracovnej smeny
        </p>
    </div>

</div>


<div class="card">

    <form method="post">

        <div class="form-group">

            <label for="employee_id">
                Zamestnanec
            </label>

            <select
                id="employee_id"
                name="employee_id"
                required
            >

                <option value="">
                    -- Vyber zamestnanca --
                </option>

                {% for employee in employees %}

                    {% if employee[5] %}

                        <option value="{{ employee[0] }}">
                            {{ employee[1] }} {{ employee[2] }}
                            — {{ employee[3] }}
                        </option>

                    {% endif %}

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="shift_date">
                Dátum
            </label>

            <input
                type="date"
                id="shift_date"
                name="shift_date"
                value="{{ selected_date }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="start_time">
                Začiatok smeny
            </label>

            <input
                type="time"
                id="start_time"
                name="start_time"
                required
            >

        </div>


        <div class="form-group">

            <label for="end_time">
                Koniec smeny
            </label>

            <input
                type="time"
                id="end_time"
                name="end_time"
                required
            >

        </div>


        <div class="form-group">

            <label for="shift_type">
                Typ smeny
            </label>

            <select
                id="shift_type"
                name="shift_type"
                required
            >

                <option value="">
                    -- Vyber typ smeny --
                </option>

                <option value="Ranná">
                    Ranná
                </option>

                <option value="Medzismena">
                    Medzismena
                </option>

                <option value="Poobedná">
                    Poobedná
                </option>

                <option value="Nočná">
                    Nočná
                </option>

            </select>

        </div>


        <div class="actions">

            <button type="submit">
                Uložiť smenu
            </button>

            <a
                href="/shifts"
                class="btn btn-secondary"
            >
                Zrušiť
            </a>

        </div>

    </form>

</div>


<div style="margin-top: 20px;">

    <a
        href="/shifts"
        class="btn btn-secondary"
    >
        ← Späť na smeny
    </a>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}
    Pridať oddelenie - Shift Planner
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Pridať oddelenie</h1>

        <p>
            Pridanie nového pracovného oddelenia
        </p>
    </div>

</div>


<div class="card">

    <form method="post">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


        <div class="form-group">

            <label for="name">
                Názov oddelenia
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ form.name.data or '' }}"
                placeholder="Napr. Výroba"
                required
            >

            {% for error in form.name.errors %}
                <span class="field-error">{{ error }}</span>
            {% endfor %}

        </div>


        <div class="actions">

            <button type="submit">
                Uložiť oddelenie
            </button>

            <a
                href="/departments"
                class="btn btn-secondary"
            >
                Zrušiť
            </a>

        </div>

    </form>

</div>


<div style="margin-top: 20px;">

    <a
        href="/departments"
        class="btn btn-secondary"
    >
        ← Späť na oddelenia
    </a>

</div>

{% endblock %}

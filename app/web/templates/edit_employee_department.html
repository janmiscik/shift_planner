{% extends "base.html" %}

{% block title %}
    Upraviť oddelenie - Shift Planner
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Upraviť oddelenie</h1>

        <p>
            Úprava pracovného zaradenia zamestnanca
        </p>
    </div>

</div>


<div class="card">

    <div class="stat-title">
        Zamestnanec
    </div>

    <h2>
        {{ employee[1] }} {{ employee[2] }}
    </h2>


    <form method="post">

        <div class="form-group">

            <label for="department_id">
                Oddelenie
            </label>

            <select
                id="department_id"
                name="department_id"
                required
            >

                {% for department in departments %}

                    {% if department[2] %}

                        <option
                            value="{{ department[0] }}"
                            {% if department[0] == assignment[2] %}
                                selected
                            {% endif %}
                        >
                            {{ department[1] }}
                        </option>

                    {% endif %}

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="weekly_hours">
                Hodiny za týždeň
            </label>

            <input
                type="number"
                id="weekly_hours"
                name="weekly_hours"
                min="0.5"
                step="0.5"
                value="{{ assignment[3] }}"
                required
            >

        </div>


        <div class="actions">

            <button type="submit">
                Uložiť zmeny
            </button>

            <a
                href="/employees/edit/{{ employee[0] }}"
                class="btn btn-secondary"
            >
                Zrušiť
            </a>

        </div>

    </form>

</div>


<div style="margin-top: 20px;">

    <a
        href="/employees/edit/{{ employee[0] }}"
        class="btn btn-secondary"
    >
        ← Späť na zamestnanca
    </a>

</div>

{% endblock %}

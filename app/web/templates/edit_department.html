<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upraviť oddelenie - Shift Planner</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header>

    <h1>SHIFT PLANNER</h1>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/employees">Zamestnanci</a>
        <a href="/departments">Oddelenia</a>
        <a href="/shifts">Smeny</a>
        <a href="/calendar">Kalendár</a>
    </nav>

</header>


<main>

    <div class="page-header">

        <h2>Upraviť oddelenie</h2>

    </div>


    <div class="card">

        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Názov oddelenia
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ department[1] }}"
                    required
                >

            </div>


            <button
                class="btn"
                type="submit"
            >
                Uložiť zmeny
            </button>


            <a
                class="btn btn-secondary"
                href="/departments"
            >
                Zrušiť
            </a>

        </form>

    </div>

</main>

</body>
</html>

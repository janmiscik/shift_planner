{% extends "base.html" %}

{% block title %}
    Pridať zamestnanca - Shift Planner
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Pridať zamestnanca</h1>

        <p>
            Pridanie nového zamestnanca do systému
        </p>
    </div>

</div>


<div class="card">

    <form method="POST">

        <div class="form-group">

            <label for="first_name">
                Meno
            </label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Zadaj meno"
                required
            >

        </div>


        <div class="form-group">

            <label for="last_name">
                Priezvisko
            </label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Zadaj priezvisko"
                required
            >

        </div>


        <div class="form-group">

            <label for="position">
                Pozícia
            </label>

            <input
                type="text"
                id="position"
                name="position"
                placeholder="Napr. Operátor"
                required
            >

        </div>


        <div class="form-group">

            <label for="weekly_hours">
                Týždenný pracovný fond
            </label>

            <input
                type="number"
                id="weekly_hours"
                name="weekly_hours"
                min="0.5"
                step="0.5"
                placeholder="Napr. 40"
                required
            >

            <small>
                Zadaj počet pracovných hodín za týždeň.
            </small>

        </div>


        <div class="actions">

            <button type="submit">
                Uložiť zamestnanca
            </button>

            <a
                href="/employees"
                class="btn btn-secondary"
            >
                Zrušiť
            </a>

        </div>

    </form>

</div>

{% endblock %}

<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upraviť smenu - Shift Planner</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header>

    <h1>SHIFT PLANNER</h1>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/employees">Zamestnanci</a>
        <a href="/shifts">Smeny</a>
        <a href="/calendar">Kalendár</a>
    </nav>

</header>


<main>

    <div class="page-header">

        <h2>Upraviť smenu</h2>

    </div>


    <div class="card">

        <form method="POST">


            <div class="form-group">

                <label for="employee_id">
                    Zamestnanec
                </label>

                <select
                    id="employee_id"
                    name="employee_id"
                    required
                >

                    {% for employee in employees %}

                        <option
                            value="{{ employee[0] }}"
                            {% if employee[0] == shift[1] %}
                                selected
                            {% endif %}
                        >
                            {{ employee[1] }} {{ employee[2] }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="shift_date">
                    Dátum
                </label>

                <input
                    type="date"
                    id="shift_date"
                    name="shift_date"
                    value="{{ shift[2] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="start_time">
                    Začiatok
                </label>

                <input
                    type="time"
                    id="start_time"
                    name="start_time"
                    value="{{ shift[3] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="end_time">
                    Koniec
                </label>

                <input
                    type="time"
                    id="end_time"
                    name="end_time"
                    value="{{ shift[4] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="shift_type">
                    Typ smeny
                </label>

                <select
                    id="shift_type"
                    name="shift_type"
                    required
                >

                    <option
                        value="Ranná"
                        {% if shift[5] == "Ranná" %}
                            selected
                        {% endif %}
                    >
                        Ranná
                    </option>


                    <option
                        value="Medzismena"
                        {% if shift[5] == "Medzismena" %}
                            selected
                        {% endif %}
                    >
                        Medzismena
                    </option>


                    <option
                        value="Poobedná"
                        {% if shift[5] == "Poobedná" %}
                            selected
                        {% endif %}
                    >
                        Poobedná
                    </option>


                    <option
                        value="Nočná"
                        {% if shift[5] == "Nočná" %}
                            selected
                        {% endif %}
                    >
                        Nočná
                    </option>

                </select>

            </div>


            <button class="btn" type="submit">
                Uložiť zmeny
            </button>


            <a
                class="btn btn-secondary"
                href="/shifts"
            >
                Zrušiť
            </a>

        </form>

    </div>

</main>

</body>
</html>

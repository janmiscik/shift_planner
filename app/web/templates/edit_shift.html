{% extends "base.html" %}

{% block title %}
    Upraviť smenu - Shift Planner
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Upraviť smenu</h1>

        <p>
            Úprava naplánovanej pracovnej smeny
        </p>
    </div>

</div>


<div class="card">

    <form method="post">

        <div class="form-group">

            <label for="employee_id">
                Zamestnanec
            </label>

            <select
                id="employee_id"
                name="employee_id"
                required
            >

                {% for employee in employees %}

                    {% if employee[5] %}

                        <option
                            value="{{ employee[0] }}"
                            {% if employee[0] == shift[1] %}
                                selected
                            {% endif %}
                        >
                            {{ employee[1] }} {{ employee[2] }}
                            — {{ employee[3] }}
                        </option>

                    {% endif %}

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="shift_date">
                Dátum
            </label>

            <input
                type="date"
                id="shift_date"
                name="shift_date"
                value="{{ shift[2] }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="start_time">
                Začiatok smeny
            </label>

            <input
                type="time"
                id="start_time"
                name="start_time"
                value="{{ shift[3] }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="end_time">
                Koniec smeny
            </label>

            <input
                type="time"
                id="end_time"
                name="end_time"
                value="{{ shift[4] }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="shift_type">
                Typ smeny
            </label>

            <select
                id="shift_type"
                name="shift_type"
                required
            >

                <option
                    value="Ranná"
                    {% if shift[5] == "Ranná" %}
                        selected
                    {% endif %}
                >
                    Ranná
                </option>

                <option
                    value="Medzismena"
                    {% if shift[5] == "Medzismena" %}
                        selected
                    {% endif %}
                >
                    Medzismena
                </option>

                <option
                    value="Poobedná"
                    {% if shift[5] == "Poobedná" %}
                        selected
                    {% endif %}
                >
                    Poobedná
                </option>

                <option
                    value="Nočná"
                    {% if shift[5] == "Nočná" %}
                        selected
                    {% endif %}
                >
                    Nočná
                </option>

            </select>

        </div>


        <div class="actions">

            <button type="submit">
                Uložiť zmeny
            </button>

            <a
                href="/shifts"
                class="btn btn-secondary"
            >
                Zrušiť
            </a>

        </div>

    </form>

</div>


<div style="margin-top: 20px;">

    <a
        href="/shifts"
        class="btn btn-secondary"
    >
        ← Späť na smeny
    </a>

</div>

{% endblock %}

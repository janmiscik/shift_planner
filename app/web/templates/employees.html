<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zamestnanci - Shift Planner</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header>

    <h1>SHIFT PLANNER</h1>

    <nav>
        <a href="/">Zamestnanci</a>
        <a href="/shifts">Smeny</a>
    </nav>

</header>

<main>

    <div class="page-header">

        <h2>Zamestnanci</h2>

        <a class="btn" href="/employees/add">
            + Pridať zamestnanca
        </a>

    </div>

    <div class="card">

        {% if employees %}

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Meno</th>
                        <th>Pozícia</th>
                        <th>Úväzok</th>
                    </tr>
                </thead>

                <tbody>

                    {% for employee in employees %}

                        <tr>
                            <td>{{ employee[0] }}</td>

                            <td>
                                {{ employee[1] }} {{ employee[2] }}
                            </td>

                            <td>{{ employee[3] }}</td>

                            <td>{{ employee[4] }}</td>
                        </tr>

                    {% endfor %}

                </tbody>

            </table>

        {% else %}

            <div class="empty">
                Žiadni zamestnanci.
            </div>

        {% endif %}

    </div>

</main>

</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Planner</title>
</head>

<body>

    <h1>SHIFT PLANNER</h1>

    <h2>Zamestnanci</h2>

    {% if employees %}
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Meno</th>
                    <th>Pozícia</th>
                    <th>Úväzok</th>
                </tr>
            </thead>

            <tbody>
                {% for employee in employees %}
                    <tr>
                        <td>{{ employee[0] }}</td>
                        <td>
                            {{ employee[1] }} {{ employee[2] }}
                        </td>
                        <td>{{ employee[3] }}</td>
                        <td>{{ employee[4] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Žiadni zamestnanci.</p>
    {% endif %}

</body>
</html>
